    </linearGradient>
    <linearGradient id="pv-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#131B33" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#0E1428" stop-opacity="0.97"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="800" fill="url(#pv-sky)"/>
